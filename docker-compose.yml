# Life OS production stack. Usage (on the server, in /opt/life-os):
#   cp .env.example .env   # fill secrets; DATABASE_URL is set below from POSTGRES_PASSWORD
#   docker compose up -d --build
# The app joins the external `web` network so the shared Caddy can reverse-proxy life.astudypro.com.
name: lifeos

x-app: &app
  image: lifeos-app:latest
  env_file: .env
  environment:
    DATABASE_URL: postgres://lifeos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/lifeos
    STORAGE_DIR: /data/media
  volumes:
    - lifeos-media:/data
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - lifeos-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos -d lifeos']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    networks: [internal]

  migrate:
    <<: *app
    build: .
    command: ['pnpm', 'db:migrate']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  app:
    <<: *app
    container_name: lifeos-app
    command: ['pnpm', 'start']
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 640m
    networks: [internal, web]

  worker:
    <<: *app
    command: ['pnpm', 'worker']
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 320m
    networks: [internal]

  # Only needed if Telegram runs in long-polling mode instead of the webhook:
  #   docker compose --profile polling up -d
  bot:
    <<: *app
    command: ['pnpm', 'bot:poll']
    healthcheck:
      disable: true
    profiles: [polling]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    networks: [internal]

networks:
  internal: {}
  web:
    external: true

volumes:
  lifeos-db:
  lifeos-media:
